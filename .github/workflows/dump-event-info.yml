name: Dump github.event
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      will_publish_packages:
        description: "Test input"
        default: "Hello, world!"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Test
      run: cat <<< "$heck"
      env:
        heck: ${{toJSON(github.event)}}
