name: Deploy pages test
on:
  push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, world from run ${{github.run_number}}‽‽‽" >> index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
